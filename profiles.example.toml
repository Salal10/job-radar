# Copy to profiles.toml (gitignored: your real profile stays on your PC) and edit.
# Each profile block is one search (one tab on the web page). After editing, re-rank with:
#   uv run python -m job_radar.daily --skip-fetch

# Red flags the CV prompt should not report or change (your decision), e.g. ["overlapping dates between jobs"]
skip_red_flags = []

[[profile]]
name = "backend"
# What you want, in plain words. This is turned into an embedding (on your PC) and compared to each job.
looking_for = """Backend software engineer building APIs and services in C# / .NET or Python,
payments or fintech, cloud (Azure or AWS), SQL databases."""
# Your CV for this kind of job (put CVs in the cvs/ folder: it is gitignored). A list = the closest is used.
cv = "cvs/My-CV-Backend.pdf"
# remote = remote from anywhere (or place not stated); move = visa, relocation, or a company on a visa sponsor list
routes = ["remote", "move"]
regions = []                       # empty = anywhere; e.g. ["Europe", "Middle East"]
sizes = []                         # empty = any; or ["startup", "scale-up", "large"] (from open roles)
max_age_days = 15                  # only jobs posted in the last 15 days
countries = []
exclude_countries = []             # never show jobs located in these countries, e.g. ["Pakistan"]
title_any = ["engineer", "developer", "programmer"]     # the title must contain one of these (empty = no check)
title_none = ["intern", "working student", "werkstudent", "trainee", "principal", "director", "sales", "manager", "frontend", "ios", "android", "ts/sci", "clearance"]
top = 15                           # how many to show

[[profile]]
name = "ai-engineer"
looking_for = """AI / LLM engineer: building applications with large language models, RAG, embeddings,
evaluation, Python, APIs. Junior to mid level."""
cv = "cvs/My-CV-AI.pdf"
routes = ["remote", "move"]
regions = []
sizes = []
max_age_days = 15
countries = []
exclude_countries = []
title_any = ["ai", "ml", "machine learning", "llm", "engineer"]
title_none = ["intern", "working student", "werkstudent", "trainee", "principal", "director", "sales", "phd", "research scientist", "trainer", "audio", "ts/sci", "clearance"]
top = 15

# Optional: working-student and internship jobs in Germany, any field, on their own "Working student" tab.
[working_student]
enabled = false       # true to turn it on
max_age_days = 5      # only jobs posted in the last N days
top = 100             # how many the tab shows, newest first
avoid = []            # hide titles containing these words, e.g. ["Pflege", "Schülerpraktikum"]
